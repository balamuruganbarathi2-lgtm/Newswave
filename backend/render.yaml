services:
  - type: web
    name: newswave-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 30d
      - key: NEWS_FETCH_INTERVAL_MINUTES
        value: 15
      - key: CORS_ORIGIN
        sync: false
